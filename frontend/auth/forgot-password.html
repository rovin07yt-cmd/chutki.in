<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="style.css">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>

<body>

<div class="header">
  <img src="./images/logo.png" class="logo">
  <div class="text">
    <div class="title">Chutki</div>
    <div class="subtitle">Food Delivery in a Chutki</div>
  </div>
</div>

<div class="container">
  <div class="card">

    <h2>Forgot Password</h2>
    <div id="gmailMessage" style="display:none;text-align:center;margin-bottom:16px;font-size:14px;color:#555;line-height:1.5;white-space:pre-line;"></div>

    <!-- STEP 1 -->
    <div id="gmailStep">

      <input
        id="gmail"
        type="email"
        autocomplete="email"
        placeholder="Enter your Gmail"
      >

      <button type="button" id="sendOtpBtn" onclick="sendOTP()">
        Send OTP
      </button>

    </div>

    <!-- STEP 2 -->
    <div id="otpStep" style="display:none;">

      <input
        id="otp"
        type="text"
        inputmode="numeric"
        maxlength="6"
        autocomplete="one-time-code"
        placeholder="Enter 6-digit OTP"
      >

      <button type="button" onclick="verifyOTP()">
        Verify OTP
      </button>

      <div class="link" id="resendArea">
        Resend OTP in <span id="countdown">30</span>s
      </div>

      <button
        type="button"
        id="resendBtn"
        onclick="resendOTP()"
        style="display:none;"
      >
        Resend OTP
      </button>

    </div>

    <!-- STEP 3 -->
    <div id="passwordStep" style="display:none;">

      <input
        id="newPassword"
        type="password"
        autocomplete="new-password"
        placeholder="New Password"
      >

      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Confirm Password"
      >

      <button type="button" onclick="resetPassword()">
        Reset Password
      </button>

    </div>

    <div class="link">
      Remember your password?
      <span onclick="location.href='login.html'">Login</span>
    </div>

    <div id="message"></div>

  </div>
</div>

<script>
const BASE_URL =
  (window.location.hostname === "localhost" ||
   window.location.hostname === "127.0.0.1")
    ? "http://localhost:3000"
    : "";

let countdownTimer = null;
let currentGmail = "";

function showMessage(message) {
  const element = document.getElementById("message");
  element.textContent = message;
  element.style.marginTop = "12px";
  element.style.textAlign = "center";
  element.style.fontSize = "14px";
}

function showGmailHint() { const element = document.getElementById("gmailMessage"); element.textContent = "OTP sent to your Gmail: " + currentGmail + "\nCheck the Spam folder of your Gmail for the OTP"; element.style.display = "block"; }
async function sendOTP() {
  const gmail = document.getElementById("gmail").value.trim().toLowerCase();

  if (!gmail) {
    showMessage("Please enter your Gmail");
    return;
  }

  try {
    const res = await fetch(BASE_URL + "/forgot-password/send-otp", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ gmail })
    });

    const data = await res.json();

    if (!data.success) {
      showMessage(data.message || "Unable to send OTP");
      return;
    }

    currentGmail = gmail;

    document.getElementById("gmail").disabled = true;
    document.getElementById("sendOtpBtn").style.display = "none";
    document.getElementById("gmailStep").style.display = "none";
    document.getElementById("otpStep").style.display = "block";

    startCountdown(30);

    if (data.data && data.data.otp) {
      showMessage("Development OTP: " + data.data.otp);
    } else {
      showGmailHint();
    }

  } catch (err) {
    console.error("FORGOT PASSWORD ERROR:", err);
    showMessage("Server error. Please try again.");
  }
}

async function resendOTP() {
  const button = document.getElementById("resendBtn");

  if (!currentGmail) {
    showMessage("Gmail is missing");
    return;
  }

  button.disabled = true;

  try {
    const res = await fetch(BASE_URL + "/forgot-password/send-otp", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        gmail: currentGmail
      })
    });

    const data = await res.json();

    if (!data.success) {
      showMessage(data.message || "Unable to resend OTP");
      button.disabled = false;
      return;
    }

    startCountdown(30);

    if (data.data && data.data.otp) {
      showMessage("Development OTP: " + data.data.otp);
    } else {
      showGmailHint();
    }

  } catch (err) {
    console.error("RESEND OTP ERROR:", err);
    showMessage("Server error. Please try again.");
    button.disabled = false;
  }
}

function startCountdown(seconds) {
  clearInterval(countdownTimer);

  const countdown = document.getElementById("countdown");
  const resendArea = document.getElementById("resendArea");
  const resendBtn = document.getElementById("resendBtn");

  let remaining = seconds;

  resendArea.style.display = "block";
  resendBtn.style.display = "none";
  resendBtn.disabled = false;
  countdown.textContent = remaining;

  countdownTimer = setInterval(() => {
    remaining--;

    if (remaining <= 0) {
      clearInterval(countdownTimer);

      resendArea.style.display = "none";
      resendBtn.style.display = "block";
      resendBtn.disabled = false;

      return;
    }

    countdown.textContent = remaining;
  }, 1000);
}

async function verifyOTP() {
  const otp = document.getElementById("otp").value.trim();

  if (!otp) {
    showMessage("Please enter the OTP");
    return;
  }

  try {
    const res = await fetch(BASE_URL + "/forgot-password/verify-otp", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        gmail: currentGmail,
        otp
      })
    });

    const data = await res.json();

    if (!data.success) {
      showMessage(data.message || "Invalid or expired OTP");
      return;
    }

    clearInterval(countdownTimer);

    document.getElementById("otpStep").style.display = "none";
    document.getElementById("passwordStep").style.display = "block";

    showMessage("OTP verified. Enter your new password.");

  } catch (err) {
    console.error("VERIFY OTP ERROR:", err);
    showMessage("Server error. Please try again.");
  }
}

async function resetPassword() {
  const newPassword =
    document.getElementById("newPassword").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const otp =
    document.getElementById("otp").value.trim();

  if (!newPassword || !confirmPassword) {
    showMessage("Please enter both password fields");
    return;
  }

  if (newPassword !== confirmPassword) {
    showMessage("Passwords do not match");
    return;
  }

  if (newPassword.length < 6) {
    showMessage("Password must be at least 6 characters");
    return;
  }

  try {
    const res = await fetch(
      BASE_URL + "/forgot-password/reset-password",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          gmail: currentGmail,
          otp,
          newPassword
        })
      }
    );

    const data = await res.json();

    if (!data.success) {
      showMessage(data.message || "Unable to reset password");
      return;
    }

    showMessage(
      "Password reset successful. Redirecting to login..."
    );

    setTimeout(() => {
      location.href = "login.html";
    }, 1500);

  } catch (err) {
    console.error("RESET PASSWORD ERROR:", err);
    showMessage("Server error. Please try again.");
  }
}
</script>

</body>
</html>
