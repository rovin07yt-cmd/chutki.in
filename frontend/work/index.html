<!DOCTYPE html>
<html>
<head>
  <title>Work With Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">

    <div class="sidebar-top">
      <div class="sidebar-header">
        <div class="avatar-small"></div>
        <div class="restro-name">Work With Us</div>
        <button onclick="toggleSidebar()">←</button>
      </div>
    </div>

    <div class="sidebar-menu">
      <div onclick="loadPage('home')">🏠 Home</div>
      <div onclick="loadPage('apply')">📝 Apply</div>
      <div onclick="loadPage('application')">📄 My Application</div>
      <div onclick="loadPage('profile')">👤 Profile</div>
      <div onclick="loadPage('notification')">🔔 Notifications</div>
      <div onclick="logout()">🚪 Logout</div>
    </div>

  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <div class="left">
        <span class="menu-btn" onclick="toggleSidebar()">☰</span>
      </div>

      <div class="center">
        <img src="/assets/logo.png" class="logo">
        <div class="text">
          <div>Work With Us</div>
          <div>Chutki</div>
        </div>
      </div>

      <div class="right">
        🔔 0
      </div>

    </div>

    <div class="page-header">
      <div id="pageTitle">HOME</div>
    </div>

    <div class="content" id="content"></div>

  </div>

</div>

<script src="work.js"></script>
</body>
</html>
