<!DOCTYPE html>
<html>
<head>
  <title>Rider Panel</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="styles/home.css">
<link rel="stylesheet" href="styles/orders.css">
<link rel="stylesheet" href="styles/route.css">
<link rel="stylesheet" href="styles/wallet.css">
<link rel="stylesheet" href="styles/notification.css">
<link rel="stylesheet" href="styles/profile.css">
<link rel="stylesheet" href="styles/history.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">

    <div class="sidebar-top">
      <div class="sidebar-header">
          <img id="sidebarImg" class="avatar-small" src="/assets/default.png">
        <div class="restro-name">Rider Name</div>
        <button onclick="toggleSidebar()">←</button>
      </div>
    </div>

    <div class="sidebar-menu">
      <div class="menu-item" data-page="home" onclick="loadPage('home')">🏠 Home</div>
      <div class="menu-item" data-page="route" onclick="loadPage('route')">🗺 Route</div>
      <div class="menu-item" data-page="wallet" onclick="loadPage('wallet')">💰 Wallet</div>
      <div class="menu-item" data-page="notification" onclick="loadPage('notification')">🔔 Notifications</div>
      <div class="menu-item" data-page="profile" onclick="loadPage('profile')">👤 Profile</div>
      <div class="menu-item" data-page="history" onclick="loadPage('history')">📜 History</div>
      <div class="menu-item logout" onclick="logout()">🚪 Logout</div>
    </div>

  </div>
<div id="overlay" onclick="toggleSidebar()"></div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <div class="left">
        <span class="menu-btn" onclick="toggleSidebar()">☰</span>
      </div>

      <div class="center">
        <img src="/assets/logo.png" class="logo">
        <div class="text">
          <div>Food delivery</div>
          <div>in a chutki</div>
        </div>
      </div>

      <div class="right">
          <span id="notificationBell" onclick="loadPage('notification')" style="cursor:pointer">🔔 0</span>

        <div class="toggle-wrapper">
          <label class="switch">
            <input type="checkbox" id="statusToggle">
            <span class="slider"></span>
          </label>
          <span id="statusText">OFFLINE</span>
        </div>
      </div>

    </div>

    <div class="page-header">
      <div id="pageTitle">HOME</div>
    </div>

    <div class="content" id="content">
      Rider Panel Ready
    </div>

  </div>


</div>
<script src="/shared/session.js"></script>
<script src="/shared/api.js"></script>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script type="module" src="rider.js"></script>
</body>
</html>
